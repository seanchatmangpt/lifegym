[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lifegym"
version = "26.8.12"
description = "Deterministic long-horizon living-world GymAct provider"
requires-python = ">=3.12"
dependencies = [
  "gymact @ git+https://github.com/seanchatmangpt/gymact.git@5a40c8f402aeb14699e216e17b2ef7aae9f0bc8f",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "rdflib==7.5.0"]

[project.scripts]
lifegym = "lifegym.cli:main"

[project.entry-points."gymact.providers"]
lifegym = "lifegym.provider:LifeGymProvider"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lifegym"]
